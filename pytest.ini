[pytest]
# Run from the project root:  python -m pytest
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers
markers =
    ui: needs Kivy installed (UI helper functions; no window is opened)
    slow: takes more than a second (threading / timing tests)
filterwarnings =
    error::pytest.PytestUnraisableExceptionWarning
