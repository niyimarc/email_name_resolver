# Runs the full pytest suite on every push and pull request.
# Results: GitHub > Actions tab (a green tick or red cross also appears next
# to each commit). Uses Windows (the app's real target) and Linux.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.12", "3.13"]   # Kivy 2.3.1 has no wheels for 3.14+

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: python -m pytest --cov=pipeline --cov=storage --cov=exporters --cov-report=term-missing --cov-fail-under=90