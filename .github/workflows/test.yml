# Runs the test suite on every push and pull request (about 1-2 minutes).
# Results: GitHub > Actions tab, and a green tick / red cross on each commit.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push cancels a test run that is still going for an older one.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: windows-latest        # the app's real target
    timeout-minutes: 10            # never let a stuck run go on for an hour
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install test dependencies (no Kivy / PyInstaller)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run tests
        run: python -m pytest --cov=pipeline --cov=storage --cov=exporters --cov-report=term --cov-fail-under=90