# Builds the standalone Windows EmailNameResolver.exe and publishes it as a
# GitHub Release. Runs ONLY when you ask for it (not on every push):
#
#   * Push a version tag:   git tag v1.0.0   then   git push origin v1.0.0
#   * Or: GitHub > Actions > "Build Windows .exe" > Run workflow
#     (enter a version such as v1.0.1)
#
# Newest .exe (works in any browser, e.g. on the RDP):
#   https://github.com/niyimarc/email_name_resolver/releases/latest/download/EmailNameResolver.exe
name: Build Windows .exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release name, e.g. v1.0.1"
        required: true

permissions:
  contents: write   # needed to create the release

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30            # a normal build takes about 8-12 minutes
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"   # Kivy 2.3.1 has no wheels for 3.14+
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build standalone .exe
        run: pyinstaller build_onefile.spec --clean -y --log-level WARN

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" dist/EmailNameResolver.exe \
            --target "${{ github.sha }}" \
            --title "Email Name Resolver $VERSION" \
            --generate-notes --latest