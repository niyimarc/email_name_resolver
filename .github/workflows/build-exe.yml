# Builds the standalone Windows EmailNameResolver.exe on GitHub's Windows
# machines and publishes it as a GitHub Release.
#
#   * Push a version tag (e.g. v1.0.0)  -> build + a Release with the .exe
#   * Actions tab > "Build Windows .exe" > Run workflow -> build only; the
#     .exe is attached to the run as an artifact (no Release).
#
# Latest release download (works in any browser, e.g. on the RDP):
#   https://github.com/niyimarc/email_name_resolver/releases/latest/download/EmailNameResolver.exe
name: Build Windows .exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed to create the Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"   # Kivy 2.3.1 has no wheels for 3.14+
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Build standalone .exe
        run: pyinstaller build_onefile.spec --clean -y

      - name: Keep the .exe with this run
        uses: actions/upload-artifact@v4
        with:
          name: EmailNameResolver-exe
          path: dist/EmailNameResolver.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/EmailNameResolver.exe --title "Email Name Resolver ${{ github.ref_name }}" --generate-notes