# Builds the standalone Windows EmailNameResolver.exe on GitHub's Windows
# machines (tests run first) and publishes it as a GitHub Release.
#
#   * Every push to master  -> release "latest-build" is replaced with the new
#                              .exe (always the newest version of master)
#   * Push a tag like v1.2.0 -> a permanent numbered release "v1.2.0"
#   * Actions tab > "Build Windows .exe" > Run workflow -> build only; the
#     .exe is attached to that run under Artifacts
#
# Newest .exe (works in any browser, e.g. on the RDP):
#   https://github.com/niyimarc/email_name_resolver/releases/latest/download/EmailNameResolver.exe
name: Build Windows .exe

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed to create/replace releases

# A newer push cancels a build that is still running for an older one.
concurrency:
  group: build-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"   # Kivy 2.3.1 has no wheels for 3.14+
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build standalone .exe
        run: pyinstaller build_onefile.spec --clean -y

      - name: Keep the .exe with this run
        uses: actions/upload-artifact@v4
        with:
          name: EmailNameResolver-exe
          path: dist/EmailNameResolver.exe

      - name: Publish "latest-build" release (push to master)
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --cleanup-tag --yes || true
          gh release create latest-build dist/EmailNameResolver.exe \
            --target "${{ github.sha }}" \
            --title "Latest build (master)" \
            --notes "Automatic build of commit ${{ github.sha }} on $(date -u '+%Y-%m-%d %H:%M UTC')." \
            --latest

      - name: Publish numbered release (version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/EmailNameResolver.exe \
            --title "Email Name Resolver ${{ github.ref_name }}" \
            --generate-notes --latest