<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="72%">
      <stop offset="0" stop-color="#0c1d14"/>
      <stop offset="0.6" stop-color="#050a07"/>
      <stop offset="1" stop-color="#010202"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#00ff88" stroke-opacity="0.06"/>
    </pattern>
    <pattern id="scan" width="5" height="5" patternUnits="userSpaceOnUse">
      <rect width="5" height="1.6" fill="#000" fill-opacity="0.22"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="clip"><rect x="16" y="16" width="480" height="480" rx="96"/></clipPath>
    <!-- "@" drawn with strokes: inner bowl + stem curling into the outer ring -->
    <g id="at" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="24">
      <circle cx="244" cy="248" r="50"/>
      <path d="M294 200 V278 Q294 312 326 312 Q376 312 376 248 A120 120 0 1 0 330 343"/>
    </g>
    <!-- glitch band: hide this strip of the glyph, redraw it shifted -->
    <mask id="noband">
      <rect width="512" height="512" fill="#fff"/>
      <rect x="0" y="262" width="512" height="13" fill="#000"/>
      <rect x="0" y="182" width="512" height="5" fill="#000"/>
    </mask>
    <clipPath id="band"><rect x="0" y="262" width="512" height="13"/></clipPath>
    <clipPath id="band2"><rect x="0" y="182" width="512" height="5"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#grid)"/>

    <g font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" fill="#00ff88" fill-opacity="0.16">
      <text x="160" y="62">40 6e 61 6d 65 3f</text>
      <text x="300" y="168">MX ok</text>
      <text x="40" y="300">0x40</text>
      <text x="400" y="330">@</text>
    </g>

    <use href="#at" stroke="#3dff83" stroke-opacity="0.75" filter="url(#glow)"/>
    <g mask="url(#noband)">
      <use href="#at" stroke="#ff2bd6" stroke-opacity="0.55" transform="translate(-6 2)"/>
      <use href="#at" stroke="#00e5ff" stroke-opacity="0.55" transform="translate(6 -2)"/>
      <use href="#at" stroke="#3dff83"/>
    </g>
    <g clip-path="url(#band)">
      <use href="#at" stroke="#00e5ff" stroke-opacity="0.6" transform="translate(30 -2)"/>
      <use href="#at" stroke="#3dff83" transform="translate(22 0)"/>
    </g>
    <g clip-path="url(#band2)">
      <use href="#at" stroke="#ff2bd6" stroke-opacity="0.8" transform="translate(-14 0)"/>
    </g>

    <g fill="none" stroke="#3dff83" stroke-width="9" stroke-linecap="square">
      <path d="M84 132 V84 H132"/>
      <path d="M380 84 H428 V132"/>
      <path d="M428 380 V428 H380"/>
      <path d="M132 428 H84 V380"/>
    </g>

    <g font-family="DejaVu Sans Mono, Consolas, monospace" font-weight="bold" font-size="30" fill="#3dff83">
      <text x="181" y="472">&gt; whois</text>
    </g>
    <rect x="309" y="450" width="15" height="26" fill="#3dff83"/>

    <rect width="512" height="512" fill="url(#scan)"/>
  </g>
  <rect x="17" y="17" width="478" height="478" rx="95" fill="none" stroke="#3dff83" stroke-opacity="0.3" stroke-width="2"/>
</svg>
